name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Otto.csproj -c Release
      - name: Unit tests
        run: dotnet test tests/Otto.Tests -c Release --logger "console;verbosity=normal"
